name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install dependencies
        run: make deps
      - name: Byte-compile
        run: make compile
      - name: Checkdoc
        run: make checkdoc
      - name: Package-lint
        run: make lint
      - name: Tests
        run: make test
